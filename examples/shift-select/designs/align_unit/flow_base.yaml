# align_unit on ASAP7 RVT, shift_select off.
design:
  top_module: align_unit
  clock_period_ps: 400
  manifest: manifest.yaml
pdk:
  profile: ../../techpack.yaml
modes:
  func: func.sdc
# The flow knobs of this example (were CIRCT_FLOW_NO_CLOCK_GATING=1 and
# CIRCT_FLOW_OUTLINE_AFTER_FLATTEN=1 in run.sh / ladder.sh).
options:
  syn.clock_gating.enable: false
  syn.outline_after_flatten: true
