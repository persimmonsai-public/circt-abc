# techpack_rails.yaml with a fanout buffer and a flavour list per rail:
# VDD_HV buffers with MBUF_X2_R above 3 loads, VDD_LV with the weaker
# MBUF_X1_R above 2 (rails.<name>.flow.fanout_buffer), and VDD_LV's swap list stops at
# lvt (rails.<name>.vt_flavours). A key a rail leaves out falls
# back to the pack-level one. Used by designs/mvt_top/flow_buf.yaml.
#
# mvt-mini profile, schema 2: both supplies as rails of one pack, mapped at
# the tt corner (techpack_corners.yaml maps at ss instead). The tt, ss and
# ff libraries are listed per rail for timing and leakage at each corner
# (the flow's STA stage); tt is the setup and the leakage corner, so the
# mapping is the tt-only pack's.
# Invented library (lib/make_libs.py; run.sh generates it). A flow config
# with a `power:` section puts each power domain on one of these rails and
# maps it with that rail's liberties only; everything else is on
# default_rail. Each rail's first liberty is its merged leakage-priced
# multi-Vt one (scripts/mvt/make_abc_lib.py: its areas are prices), so ABC
# chooses the flavour per cell; the real per-flavour libraries follow.
schema: 2
name: mvt_mini_rails_buf
time_unit: ns
icg: {cell: MICG_X1_R, clk: CK, en: E, test_en: SE, out: ECK}
dont_use: []
tie: {hi: "MTIEHI_R:H", lo: "MTIELO_R:L"}
# The threshold flavour in a cell name (MNAND2_X1_S), slowest first: the
# flow's vt_swap stage (circt_flow/vtswap.py).
vt_flavours:
  tokens: [R, L, S]
  re: '_([RLS])$'
public: true
corners:
  names: [tt, ss, ff]
  setup: tt
  leakage: tt
default_rail: VDD_HV
rails:
  VDD_HV:
    voltage: 0.75
    liberties:
      - lib/mini_mvt_0p75v_tt_abc.lib
      - lib/mini_rvt_0p75v_tt.lib
      - lib/mini_lvt_0p75v_tt.lib
      - lib/mini_slvt_0p75v_tt.lib
    corners:
      tt: [lib/mini_rvt_0p75v_tt.lib, lib/mini_lvt_0p75v_tt.lib, lib/mini_slvt_0p75v_tt.lib]
      ss: [lib/mini_rvt_0p75v_ss.lib, lib/mini_lvt_0p75v_ss.lib, lib/mini_slvt_0p75v_ss.lib]
      ff: [lib/mini_rvt_0p75v_ff.lib, lib/mini_lvt_0p75v_ff.lib, lib/mini_slvt_0p75v_ff.lib]
    flow:
      # Per-cell delays and a real delay target for &nf: see abc/mvt.abc.
      abc_read_lib_args: "-l"
      abc_script_file: abc/mvt.abc
      fanout_buffer: {cell: MBUF_X2_R, input: A, output: Y, max_fanout: 3}
  VDD_LV:
    voltage: 0.55
    liberties:
      - lib/mini_mvt_0p55v_tt_abc.lib
      - lib/mini_rvt_0p55v_tt.lib
      - lib/mini_lvt_0p55v_tt.lib
      - lib/mini_slvt_0p55v_tt.lib
    corners:
      tt: [lib/mini_rvt_0p55v_tt.lib, lib/mini_lvt_0p55v_tt.lib, lib/mini_slvt_0p55v_tt.lib]
      ss: [lib/mini_rvt_0p55v_ss.lib, lib/mini_lvt_0p55v_ss.lib, lib/mini_slvt_0p55v_ss.lib]
      ff: [lib/mini_rvt_0p55v_ff.lib, lib/mini_lvt_0p55v_ff.lib, lib/mini_slvt_0p55v_ff.lib]
    flow:
      abc_read_lib_args: "-l"
      abc_script_file: abc/mvt.abc
      fanout_buffer: {cell: MBUF_X1_R, input: A, output: Y, max_fanout: 2}
    # vt_swap never moves a VDD_LV cell to slvt. (ABC's mapping library still
    # holds slvt, so a few mapped cells are slvt and stay: banning it at the
    # mapper takes dont_use or a priced library without it.)
    vt_flavours:
      tokens: [R, L]
      re: '_([RLS])$'
# The cells power.insert_level_shifters puts on the signals that cross
# between the rails (one tt library, read at every corner).
level_shifters:
  liberties:
    - lib/mini_ls.lib
