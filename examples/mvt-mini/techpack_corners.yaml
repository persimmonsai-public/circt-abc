# mvt-mini profile, schema 2 with corners: both supplies as rails, each
# with its libraries at three corners (lib/make_libs.py; run.sh generates
# them). Corners are invented: tt (typical, 25 C), ss (slow, cold: slower,
# leaks less), ff (fast, hot: faster, leaks more).
#
# The setup corner, ss, is the one mapping times against: each rail's
# mapping-primary liberty is the merged multi-Vt one built from the ss
# libraries' timing with the ff libraries' leakage as the price
# (scripts/mvt/make_abc_lib.py --leakage-lib; its areas are prices), and the
# mapping target's flop overhead comes from the rail's ss flops. The ss
# real libraries follow it. Every corner is listed per rail, for STA and
# leakage at each.
schema: 2
name: mvt_mini_corners
time_unit: ns
icg: {cell: MICG_X1_R, clk: CK, en: E, test_en: SE, out: ECK}
dont_use: []
tie: {hi: "MTIEHI_R:H", lo: "MTIELO_R:L"}
# The threshold flavour in a cell name (MNAND2_X1_S), slowest first: the
# flow's vt_swap stage (circt_flow/vtswap.py).
vt_flavours:
  tokens: [R, L, S]
  re: '_([RLS])$'
public: true
corners:
  names: [tt, ss, ff]
  setup: ss
  leakage: ff
  hold: ff       # the fastest corner: vt_swap's hold guard, STA's hold entry
default_rail: VDD_HV
rails:
  VDD_HV:
    voltage: 0.75
    liberties:
      - lib/mini_mvt_0p75v_ss_ffleak_abc.lib
      - lib/mini_rvt_0p75v_ss.lib
      - lib/mini_lvt_0p75v_ss.lib
      - lib/mini_slvt_0p75v_ss.lib
    corners:
      tt: [lib/mini_rvt_0p75v_tt.lib, lib/mini_lvt_0p75v_tt.lib, lib/mini_slvt_0p75v_tt.lib]
      ss: [lib/mini_rvt_0p75v_ss.lib, lib/mini_lvt_0p75v_ss.lib, lib/mini_slvt_0p75v_ss.lib]
      ff: [lib/mini_rvt_0p75v_ff.lib, lib/mini_lvt_0p75v_ff.lib, lib/mini_slvt_0p75v_ff.lib]
    flow:
      abc_read_lib_args: "-l"
      abc_script_file: abc/mvt.abc
  VDD_LV:
    voltage: 0.55
    liberties:
      - lib/mini_mvt_0p55v_ss_ffleak_abc.lib
      - lib/mini_rvt_0p55v_ss.lib
      - lib/mini_lvt_0p55v_ss.lib
      - lib/mini_slvt_0p55v_ss.lib
    corners:
      tt: [lib/mini_rvt_0p55v_tt.lib, lib/mini_lvt_0p55v_tt.lib, lib/mini_slvt_0p55v_tt.lib]
      ss: [lib/mini_rvt_0p55v_ss.lib, lib/mini_lvt_0p55v_ss.lib, lib/mini_slvt_0p55v_ss.lib]
      ff: [lib/mini_rvt_0p55v_ff.lib, lib/mini_lvt_0p55v_ff.lib, lib/mini_slvt_0p55v_ff.lib]
    flow:
      abc_read_lib_args: "-l"
      abc_script_file: abc/mvt.abc
level_shifters:
  liberties:
    - lib/mini_ls.lib
