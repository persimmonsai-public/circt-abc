# The .mlir files here are hand-written IR FIXTURES, not executable tests:
# they carry no RUN line and no CHECK line, and their expectations live only
# in prose header comments. lit would report every one as Unresolved.
#
# They are kept because the fixtures themselves are useful inputs. Converting
# one into a real test means adding a RUN line and CHECK lines that encode
# what its header already claims in prose, then deleting the line below.
config.unsupported = True
