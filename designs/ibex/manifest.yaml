# ibex_top, as the flow's front end elaborates it (circt_flow/frontend.py).
design:
  name: ibex
  top: ibex_top
  source:
    git: https://github.com/lowRISC/ibex.git
    commit: 8b8ee086aef72e0833b7f0493d9d33f1e4d3c8e2
  # In elaboration order, relative to the source checkout. `@clock_gate`
  # marks where the generated clock-gate wrapper and cell stub go.
  files:
    - vendor/lowrisc_ip/ip/prim/rtl/prim_count_pkg.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_cipher_pkg.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_util_pkg.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_mubi_pkg.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_secded_pkg.sv
    - vendor/lowrisc_ip/ip/prim_generic/rtl/prim_ram_1p_pkg.sv
    - rtl/ibex_cheriot_pkg.sv
    - rtl/ibex_pkg.sv
    - rtl/ibex_tracer_pkg.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_count.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_39_32_dec.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_secded_inv_39_32_enc.sv
    - vendor/lowrisc_ip/ip/prim/rtl/prim_lfsr.sv
    - vendor/lowrisc_ip/ip/prim_generic/rtl/prim_and2.sv
    - vendor/lowrisc_ip/ip/prim_generic/rtl/prim_buf.sv
    - vendor/lowrisc_ip/ip/prim_generic/rtl/prim_clock_mux2.sv
    - vendor/lowrisc_ip/ip/prim_generic/rtl/prim_flop.sv
    - "@clock_gate"
    - rtl/ibex_alu.sv
    - rtl/ibex_branch_predict.sv
    - rtl/ibex_cheriot_ex.sv
    - rtl/ibex_compressed_decoder.sv
    - rtl/ibex_controller.sv
    - rtl/ibex_core.sv
    - rtl/ibex_counter.sv
    - rtl/ibex_cs_registers.sv
    - rtl/ibex_csr.sv
    - rtl/ibex_decoder.sv
    - rtl/ibex_dummy_instr.sv
    - rtl/ibex_ex_block.sv
    - rtl/ibex_fetch_fifo.sv
    - rtl/ibex_icache.sv
    - rtl/ibex_id_stage.sv
    - rtl/ibex_if_stage.sv
    - rtl/ibex_load_store_unit.sv
    - rtl/ibex_lockstep.sv
    - rtl/ibex_multdiv_fast.sv
    - rtl/ibex_multdiv_slow.sv
    - rtl/ibex_pmp.sv
    - rtl/ibex_prefetch_buffer.sv
    - rtl/ibex_register_file_ff.sv
    - rtl/ibex_register_file_latch.sv
    - rtl/ibex_top.sv
    - rtl/ibex_trvk.sv
    - rtl/ibex_wb_stage.sv
  include_dirs:
    - vendor/lowrisc_ip/ip/prim/rtl
    - vendor/lowrisc_ip/dv/sv/dv_utils
  defines: [SYNTHESIS, YOSYS]
  parameters:
    RV32M: ibex_pkg::RV32MSlow
  # The design's clock-gating primitive. The front end writes a module of
  # this name that instantiates the profile's ICG cell, so the vendor
  # prim_generic version must not be on the file list.
  clock_gate:
    module: prim_clock_gating
    ports: {clk: clk_i, en: en_i, test_en: test_en_i, out: clk_o}
constraints:
  clock_port: clk_i
